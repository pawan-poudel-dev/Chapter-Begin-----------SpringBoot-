# AI Desktop Agent - Base Configuration
# Secrets (API keys) must NEVER be placed in this file — use environment variables only.

app.name=AI Desktop Agent
app.version=0.1.0-SNAPSHOT
logging.level=INFO

# AI provider: openai | gemini | google | anthropic
# Free Google Gemini: set GEMINI_API_KEY or GOOGLE_API_KEY (auto-detected if OpenAI key absent)
ai.provider=openai
ai.model=gpt-4o-mini
ai.base-url=

# For Gemini explicitly you can set:
# ai.provider=gemini
# ai.model=gemini-2.0-flash
# ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai

voice.enabled=false
data.directory=./data
voice.language=en
voice.wake-word=
voice.max-utterance-ms=8000
voice.silence-ms=1200
