<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeRoast</title>
<style>
:root{--bg:#0d0d0f;--panel:#17171b;--line:#2a2a31;--txt:#ecebe6;--mut:#8a8a94;--hot:#ff5c33;--gold:#ffb84d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-monospace,Consolas,monospace;padding:28px 16px;display:flex;justify-content:center}
.wrap{width:100%;max-width:820px}h1{margin:0;font-size:34px;letter-spacing:-1px}h1 em{color:var(--hot);font-style:normal}
.sub{color:var(--mut);margin:6px 0 20px}textarea{width:100%;height:260px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:14px;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
textarea:focus{outline:1px solid var(--hot)}.btns{display:flex;gap:10px;margin:12px 0}
button{background:var(--hot);color:#140a05;border:0;border-radius:8px;padding:11px 18px;font:700 14px ui-monospace,Consolas,monospace;cursor:pointer}
button.g{background:transparent;color:var(--txt);border:1px solid var(--line)}
.score{display:flex;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin:18px 0}
.num{font-size:64px;font-weight:800;line-height:1;color:var(--hot)}.num small{font-size:18px;color:var(--mut)}
.meta b{font-size:18px;color:var(--gold)}.meta div{color:var(--mut);margin-top:6px}
.f{background:var(--panel);border-left:3px solid var(--hot);border-radius:6px;padding:12px 14px;margin:10px 0}
.f .ln{color:var(--mut);font-size:12px}.f code{display:block;margin:6px 0;color:var(--gold);white-space:pre-wrap;word-break:break-all}.f p{margin:0}
.err{color:var(--hot)}
</style></head><body><div class="wrap">
<h1>Code<em>Roast</em></h1><p class="sub">Paste your Java. Your code called. It wants a lawyer.</p>
<textarea id="code" spellcheck="false" placeholder="// paste Java here, if you dare"></textarea>
<div class="btns"><button onclick="roast()">Roast me</button><button class="g" onclick="sample()">Load terrible sample</button></div>
<div id="out"></div></div>
<script type="text/plain" id="sample">public class Main {
    // int old = calculate();
    public static void main(String[] args) {
        boolean temp = true;
        String data = "hello";
        int timeout = 86400;
        // TODO fix this later
        for (int i = 0; i < 10; i++) {
            if (i > 2) {
                if (i < 9) {
                    if (temp == true) {
                        System.out.println("here");
                        System.out.println("here 2");
                        System.out.println("why");
                    }
                }
            }
        }
        try {
            Thread.sleep(5000);
        } catch (Exception e) {
        }
        try { risky(); } catch (Exception e) { e.printStackTrace(); }
    }
}</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sample(){$('code').value=$('sample').textContent;roast()}
async function roast(){
  const res=await fetch('/api/roast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});
  const r=await res.json();
  if(!res.ok){$('out').innerHTML=`<p class="err">${esc(r.message||'Something broke.')}</p>`;return}
  window.last=r;
  $('out').innerHTML=`<div class="score"><div class="num">${r.score}<small>/100</small></div>
    <div class="meta"><b>Grade ${r.grade} · ${r.title}</b><div>${r.verdict}</div><div>${r.lines} lines · ${r.findings.length} crimes</div>
    <div style="margin-top:10px"><button class="g" onclick="share()">Copy result</button></div></div></div>`+
    r.findings.map(f=>`<div class="f"><span class="ln">line ${f.line} · ${esc(f.rule)}</span><code>${esc(f.snippet)}</code><p>${esc(f.roast)}</p></div>`).join('');
}
function share(){const r=window.last;navigator.clipboard.writeText(`My code scored ${r.score}/100 on CodeRoast: "${r.title}"`);}
</script></body></html>
